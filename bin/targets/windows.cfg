# Windows platform bindings.
#
# Selected automatically by --target=<any windows target>. Only the OS matters
# here: x86-win, x64-win and arm64-win all bind to the same library modules.
#
# These forwards used to live in templates/console.cfg, which conflated the
# SHAPE of a program (console vs GUI) with the PLATFORM it runs on. They are
# different axes: a console program exists on every OS.

[forwards]
'program'output=win32'io'stdoutput
'program'input=win32'io'stdinput
'program'commandline=win32'api'commandline
