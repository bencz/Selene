// Linux platform bindings.
//
// The axis is the OPERATING SYSTEM, never the architecture: s390x and
// x86-64 Linux bind to exactly the same library modules. Program shape
// (console/gui) stays in templates/; ABI facts live in the TargetInfo
// table inside the compiler.
//
// These forwards take effect when the translation half resolves forwards
// (the closure driver); until then this file documents the axis.

[forwards]
'program'output=system'console
'program'input=system'console
