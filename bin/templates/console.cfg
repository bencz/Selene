// Console program SHAPE -- one axis only.
//
// The 2015 win32_console.cfg conflated three axes: program shape (these
// forwards), the operating system ('program'output bindings, now in
// targets/<os>.cfg) and the JIT primitives ([primitives] core*.bin, gone
// with the JIT). Only the shape lives here.

[forwards]
'startUp=system'startUp
'program'arguments=extensions'arguments

[system]
platform=1
